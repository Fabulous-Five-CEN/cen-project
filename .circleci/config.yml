version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
      - image: mariadb:11.4
        environment:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cen_test
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpass

    steps:
      - checkout

      - run:
          name: Load environment variables
          command: |
            # Export all variables from the parent .env file
            set -a
            source ../.env
            set +a
            echo "Loaded .env variables"

      - run:
          name: Set up Python environment
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r cen-project/requirements.txt

      - run:
          name: Wait for MariaDB to start
          command: |
            for i in `seq 1 20`; do
              nc -z 127.0.0.1 3306 && echo "DB is up!" && break
              echo "Waiting for DB..."
              sleep 2
            done

      - run:
          name: Run Flask integration tests
          command: |
            . venv/bin/activate
            cd cen-project
            python -m unittest discover -v

workflows:
  test-workflow:
    jobs:
      - test
