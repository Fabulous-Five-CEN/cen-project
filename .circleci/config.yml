version: 2.1

jobs:
  docker-and-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      APP_PORT: 8001
      DB_PORT: 3306
      DB_NAME: cen_ci
      DB_USER: cen_ci_user
      DB_PASSWORD: cen_ci_password
      MARIADB_ROOT_PASSWORD: cen_root_password
      BACKEND_HOST: http://localhost
      TEST_USER_ID: "2"
    steps:
      - checkout
      - run:
          name: Recreate docker-compose.yml from DOCKERCOMPOSEFILE
          command: |
            if [ -z "${DOCKERCOMPOSEFILE:-}" ]; then
              echo "DOCKERCOMPOSEFILE environment variable is not set." >&2
              exit 1
            fi
            printf '%s' "$DOCKERCOMPOSEFILE" | base64 --decode > docker-compose.yml
            ls -l docker-compose.yml
      - run:
          name: Ensure cen-project directory exists for Docker context
          command: |
            if [ ! -d cen-project ]; then
              ln -snf . cen-project
            fi
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip docker-compose-plugin curl
      - run:
          name: Install Python dependencies
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
      - run:
          name: Build and start Docker services
          command: docker compose up -d --build
      - run:
          name: Seed database fixtures
          command: |
            docker compose exec -T web python -m app.scripts.test_seed_users
            docker compose exec -T web python -m app.scripts.seed_cards
      - run:
          name: Wait for application to become healthy
          command: |
            for i in {1..40}; do
              if curl -sSf "http://localhost:${APP_PORT}/cards/" > /dev/null; then
                echo "Application is responding"
                exit 0
              fi
              sleep 5
            done
            docker compose logs
            echo "Application failed to start" >&2
            exit 1
      - run:
          name: Run application tests (app/tests)
          command: |
            python3 -m unittest discover -s app/tests -v
      - run:
          name: Run repository root tests folder
          command: python3 -m unittest discover -s tests -v
      - run:
          name: Tear down Docker services
          command: docker compose down -v
          when: always

workflows:
  build-and-test:
    jobs:
      - docker-and-tests
