<!doctype html>
<!-- this is a comment -->
<html lang = "en" data-bs-theme = "light">
<head>
  <meta charset = "utf-8">
  <meta name = "viewport" content = "width = device-width, initial-scale = 1">
  <title>LEMMATICA</title> 
  <!-- Add Bootstrap's styling, without downloading the files ourselves --> 
  <!-- Using the CDN is one of the simplest ways to get started -->
  <!-- Bootstrap5 -->
  <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet" integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
crossorigin = "anonymous">
  <style>

    .card-container { perspective: 1000px; }
    
    .card-face {
      position: relative;
      width: 280px;
      height: 180px; 
      transition: transform .3s; 
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .front, .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 0.5rem;
    }

    .back { transform: rotateY(180deg); }
    .flipped .front { transform: rotateY(180deg); }
    .flipped .back  { transform: rotateY(0deg); }

    .fab { 
      position: fixed; 
      right: 24px; 
      bottom: 24px; 
      z-index: 1030; }
  </style>
</head>
 
<body class = "d-flex flex-column min-vh-100">
  <!-- Navigation Bar -->
  <nav class = "navbar navbar-expand-md bg-primary navbar-dark">
    <div class = "container" >
      <a class = "navbar-brand fw-semibold" href="#">Lemmatica</a>
      <button class = "navbar-toggler" type = "button" data-bs-toggle = "collapse" data-bs-target = "#topnav" aria-controls = "topnav" aria-expanded = "false" aria-label = "Toggle navigation">
        <span class = "navbar-toggler-icon"></span>
      </button>
      <div id = "topnav" class = "collapse navbar-collapse">
        <ul class = "navbar-nav ms-auto">
          <li class = "nav-item"><a class = "nav-link active" data-bs-toggle = "tab" href = "#tab-cards" role = "tab">All Cards</a></li>
          <li class = "nav-item"><a class = "nav-link" data-bs-toggle="tab" href = "#tab-sets" role="tab">My Sets</a></li>
          <li class = "nav-item"><a class = "nav-link" data-bs-toggle="tab" href = "#tab-practice" role="tab">Practice</a></li>
          <li class = "nav-item"><a class = "nav-link" data-bs-toggle="tab" href = "#tab-account" role="tab">Account</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <!-- Tabs on Top -->
  <main class = "container py-4 flex-grow-1"">
    <div class = "tab-content">

    <!-- All of the Cards --> 
    <section class = "tab-pane fade show active" id = "tab-cards" role = "tabpanel">
      <div class = "d-flex gap-3 align-items-center mb-3">
        <input id = "searchCards" class = "form-control" placeholder = "Search the cards.">
        <button class = "btn btn-outline-primary" data-bs-toggle = "modal" data-bs-target = "#cardModal">
          Add Card 
          +
        </button>
      </div>

    <!-- Create a Bootstrap Grid Row -->
    <!-- Each card is one column --> 
    <div id = "cardsGrid" class = "row g-3">    
      <!-- One card's container; inside the row -->
      <!-- Full width, 1/2 width, 1/3 width, 1/4 width, hold card's id, for delete --> 
      <div class= "col-12 col-sm-6 col-md-4 col-lg-3" data-card-id = "1">
        <!-- h-100 means that each card fills the height of the column -->
	<div class = "card h-100">
          <div class = "card-body"> 
            <!-- Content inside the card -->
            <div class = "small text-muted">Spanish</div>
            <h5 class = "card-title mb-1">¿Cómo estás?</h5>
            <div class = "small text-muted">English</div>
            <p class = "card-text mb-2">How are you?</p>
            <div class = "d-flex justify-content-between">
              <button class = "btn btn-sm btn-outline-primary" data-action = "editCard" data-bs-toggle = "modal" data-bs-target = "#cardModal">Edit</button>
              <button class = "btn btn-sm btn-outline-danger" data-action = "deleteCard">Delete</button>
            </div>
           </div>
          </div>
         </div>
      <!-- JS should add more cards here -->
    </div>
    </section>

   <!-- Empty, placeholder for now -->
   <section class = "tab-pane fade" id = "tab-sets" role = "tabpanel"></section>
   <section class = "tab-pane fade" id = "tab-practice" role = "tabpanel"></section>
   <section class = "tab-pane fade" id = "tab-account" role = "tabpanel"></section>

    </div>
  </main>


  <!-- Button  -->
  <button class = "btn btn-primary rounded-circle fab shadow" style = "width:56px; height:56px"  
    data-bs-toggle = "modal" data-bs-target = "#cardModal" aria-label= "Add card">+
  </button>  

  <!-- Modals -->
  <!-- Add/edit the card -->
  <div class = "modal fade" id = "cardModal" tabindex = "-1" aria-hidden = "true">
    <div class = "modal-dialog modal-lg">
      <form class = "modal-content" id = "cardForm" novalidate>
        <div class = "modal-header">
	  <h5 class = "modal-title">Add / Edit Card</h5>
          <button class = "btn-close" data-bs-dismiss = "modal" aria-label = "Close"></button>
        </div>
        <div class = "modal-body">
          <div class = "col-md-6">
            <label class = "form-label">Spanish</label>
            <textarea class = "form-control" id = "enText" rows = "3" required></textarea>
          </div>
          <div class = "col-md-6">
            <label class = "form-label">English</label>
            <textarea class = "form-control" id = "esText" rows = "3" required></textarea>
          </div>
          <div class = "col-12">
            <label class = "form-label">Notes</label>
            <textarea class = "form-control" id = "notes" rows = "2"></textarea>
          </div>
          <div class = "col-12">
            <label class = "form-label">Add to set</label>
            <select id = "cardSets" class = "form-select" multiple>
              <option value = "s1">Set1</option>
            </select>
            <div class = "form-text">Select one or more sets.</div>
	  </div>
	</div>
        <div class = "modal-footer">
          <button class = "btn btn-primary" type = "submit">Save</button>
          <button class = "btn btn-secondary" data-bs-dismiss = "modal">Cancel</button>
        </div>
      </form>
      </div>
  </div>

  <footer class = "text-center py-3 mt-5 text-muted small">
    Copyright 2025 Lemmatica:  a social impact project.  
  </footer> 

 
  <!-- Bootstrap Javascript for tabs and modals -->
  <script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
