{% extends 'base.html' %}

{% block content %}
<main id="sets-page" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">My Sets</h5>
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#setEditModal" data-set-id="">
            New Set +
        </button>
    </div>

    <div class="accordion" id="setsAccordion">
        </div>
    
      <!-- ===========================================
       EDIT SET MODAL (skeleton UI, not wired yet)
       =========================================== -->
    <div class="modal fade" id="setEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
        <form class="modal-content" id="setForm" novalidate>
            <div class="modal-header">
            <h5 class="modal-title">Edit Set</h5>
            <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
            <label class="form-label" for="setName">Name</label>
            <input id="setName" class="form-control" required>
            <label class="form-label mt-3" for="setDesc">Description</label>
            <textarea id="setDesc" class="form-control" rows="2"></textarea>
            </div>
            <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
        </div>
    </div>
</main>
{% endblock %}
