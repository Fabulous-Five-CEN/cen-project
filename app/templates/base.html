<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lemmatica</title>

  <!-- PRODUCTION: real Bootstrap CSS, no demo here -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">

</head>
<body>
  {% include 'layout_header.html' %}

  {% block content %}{% endblock %}

  <!-- PRODUCTION: real Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <footer class="text-center py-3 mt-auto text-muted small">
    © 2025 Lemmatica — a social impact project
  </footer>

  <script>
  /* =========================================================
     A) STATE (PRODUCTION, client-side only)
     ---------------------------------------------------------
     - Cards + set names are persisted in localStorage.
     - No server / login, so this is "production" for a demo
       or MVP that runs entirely in the browser.
     ========================================================= */

  let cards = JSON.parse(localStorage.getItem('cards') || '[]');        // PRODUCTION: actual flashcards
  let userSets = JSON.parse(localStorage.getItem('userSets') || '[]');  // PRODUCTION: set objects with name and description

  // Migration: convert old string-based sets to objects
  if (userSets.length > 0 && typeof userSets[0] === 'string') {
    userSets = userSets.map(name => ({ name, description: '' }));
    localStorage.setItem('userSets', JSON.stringify(userSets));
  }


  // NEW: which set (if any) is being viewed on the All Cards tab
  let activeSetFilter = null;


  /* =========================================================
     B) DOM REFS (PRODUCTION)
     ========================================================= */

  const cardsGrid         = document.getElementById('cardsGrid');
  const notesEl           = document.getElementById('notes');
  const setsEl            = document.getElementById('cardSets');
  const practiceSetSelect = document.getElementById('practiceSet');
  const userSetsList      = document.getElementById('userSetsList');

  const activeSetIndicator = document.getElementById('activeSetIndicator');
  const activeSetLabel     = document.getElementById('activeSetLabel');
  const clearSetFilterBtn  = document.getElementById('clearSetFilter');


  let editIndex = null; // PRODUCTION: index into cards[] when editing
  let editSetIndex = null; // Index into userSets[] when editing a set

  /* =========================================================
     C) SETS HELPERS (PRODUCTION, but counts still TODO)
     ========================================================= */

  // PRODUCTION: read which sets were checked for a card
  function getSelectedSets() {
    return Array.from(setsEl.options)
      .filter(o => o.selected && o.value)
      .map(o => o.value);
  }

  // PRODUCTION: pre-select sets for Edit Card
  function setSelectedSets(values = []) {
    Array.from(setsEl.options).forEach(o => {
      o.selected = values.includes(o.value);
    });
  }

  // PRODUCTION: inject a set name into both selects
  function addSetOption(setObj) {
    const name = typeof setObj === 'string' ? setObj : setObj.name;
    if (!name) return;

    // Add to Add-Card modal's select
    let exists = Array.from(setsEl.options).some(o => o.value === name);
    if (!exists) {
      const opt = new Option(name, name);
      setsEl.appendChild(opt);
    }

    // Add to Practice select
    exists = Array.from(practiceSetSelect.options).some(o => o.value === name);
    if (!exists) {
      const opt2 = new Option(name, name);
      practiceSetSelect.appendChild(opt2);
    }
  }

  // Count cards in a specific set
  function countCardsInSet(setName) {
    return cards.filter(card => 
      Array.isArray(card.sets) && card.sets.includes(setName)
    ).length;
  }

    // PRODUCTION: render the list of sets on the "My Sets" tab
  // Show user-created sets on My Sets tab, with View + Delete buttons
function renderUserSets() {
  if (!userSetsList) return;

  const emptyState = document.getElementById('emptySetsMessage');

  userSetsList.innerHTML = '';

  if (!userSets.length) {
    // No sets → show empty message
    if (emptyState) emptyState.classList.remove('d-none');
    return;
  }

  // We have sets → hide empty message
  if (emptyState) emptyState.classList.add('d-none');

  userSets.forEach((setObj, index) => {
    const name = setObj.name;
    const description = setObj.description || '';
    const cardCount = countCardsInSet(name);
    
    const card = document.createElement('div');
    card.className = 'card border-0 shadow-sm';

    const body = document.createElement('div');
    body.className = 'card-body py-2';

    body.innerHTML = `
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <div class="fw-semibold">${name}</div>
          ${description ? `<div class="small text-muted mt-1">${description}</div>` : ''}
          <div class="small text-muted mt-1">${cardCount} card${cardCount !== 1 ? 's' : ''}</div>
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn btn-sm btn-outline-secondary"
            data-action="editSet"
            data-set-index="${index}">
            Edit
          </button>
          <button
            class="btn btn-sm btn-outline-primary"
            data-action="viewSet"
            data-set-name="${name}">
            View
          </button>
          <button
            class="btn btn-sm btn-outline-danger"
            data-action="deleteSet"
            data-set-name="${name}">
            Delete
          </button>
        </div>
      </div>
    `;

    card.appendChild(body);
    userSetsList.appendChild(card);
  });
}


  // PRODUCTION: Handle clicks on the My Sets list (View + Delete + Edit)
userSetsList.addEventListener('click', (e) => {
  const action = e.target.dataset.action;
  const name   = e.target.dataset.setName;
  const index  = e.target.dataset.setIndex;
  
  if (!action) return;

  // EDIT: open modal with existing name and description
  if (action === 'editSet') {
    editSetIndex = parseInt(index);
    const setObj = userSets[editSetIndex];
    
    document.getElementById('setName').value = setObj.name;
    document.getElementById('setDesc').value = setObj.description || '';
    document.getElementById('setModalTitle').textContent = 'Edit Set';
    
    const modalEl = document.getElementById('setEditModal');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();
    return;
  }

  // VIEW: jump to All Cards and filter by this set
  if (action === 'viewSet') {
    activeSetFilter = name;          // remember which set we're showing
    renderCards();                   // re-render All Cards using filter

    // switch navbar to "All Cards" tab
    const allCardsLink = document.querySelector('.nav-link[href="#tab-cards"]');
    if (allCardsLink) {
      allCardsLink.click();
    }
    return;
  }

  // DELETE: remove the set everywhere
  if (action === 'deleteSet') {
    if (!window.confirm(
      `Delete set "${name}"? This will remove it from cards but not delete the cards themselves.`
    )) {
      return;
    }

    // 1) Remove from userSets array + localStorage
    userSets = userSets.filter(s => s.name !== name);
    localStorage.setItem('userSets', JSON.stringify(userSets));

    // 2) Remove from the "Add to set" dropdown in the Card modal
    Array.from(setsEl.options).forEach(o => {
      if (o.value === name) o.remove();
    });

    // 3) Remove from the Practice set dropdown
    Array.from(practiceSetSelect.options).forEach(o => {
      if (o.value === name) o.remove();
    });

    // 4) Remove this set tag from any cards that used it
    cards = cards.map(card => {
      const oldSets = Array.isArray(card.sets) ? card.sets : [];
      const newSets = oldSets.filter(s => s !== name);
      return { ...card, sets: newSets };
    });
    localStorage.setItem('cards', JSON.stringify(cards));

    // 5) If we were viewing this set, clear the filter
    if (activeSetFilter === name) {
      activeSetFilter = null;
    }

    // 6) Re-render UI
    renderUserSets();
    renderCards();
  }
});






  // PRODUCTION: handle New Set form submit (creates real set names)
  document.getElementById('setForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const nameInput = document.getElementById('setName');
    const descInput = document.getElementById('setDesc');

    const name = nameInput.value.trim();
    const description = descInput.value.trim();
    
    if (!name) return;

    if (editSetIndex !== null) {
      // EDITING existing set
      const oldName = userSets[editSetIndex].name;
      
      // Update the set object
      userSets[editSetIndex] = { name, description };
      localStorage.setItem('userSets', JSON.stringify(userSets));
      
      // If name changed, update it everywhere
      if (oldName !== name) {
        // Update in card modal dropdown
        Array.from(setsEl.options).forEach(o => {
          if (o.value === oldName) {
            o.value = name;
            o.text = name;
          }
        });
        
        // Update in practice dropdown
        Array.from(practiceSetSelect.options).forEach(o => {
          if (o.value === oldName) {
            o.value = name;
            o.text = name;
          }
        });
        
        // Update in all cards that reference this set
        cards = cards.map(card => {
          if (Array.isArray(card.sets)) {
            return {
              ...card,
              sets: card.sets.map(s => s === oldName ? name : s)
            };
          }
          return card;
        });
        localStorage.setItem('cards', JSON.stringify(cards));
        
        // Update active filter if it was showing this set
        if (activeSetFilter === oldName) {
          activeSetFilter = name;
        }
      }
      
      editSetIndex = null;
      renderUserSets();
      renderCards();
      
    } else {
      // CREATING new set
      // 1) Add to selects so you can assign cards to this set
      addSetOption({ name, description });

      // 2) Persist the set
      if (!userSets.some(s => s.name === name)) {
        userSets.push({ name, description });
        localStorage.setItem('userSets', JSON.stringify(userSets));
        renderUserSets(); // re-render My Sets list
      }
    }

    // 3) Clear + close modal
    nameInput.value = '';
    descInput.value = '';

    const modalEl = document.getElementById('setEditModal');
    const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
    modal.hide();
  });

  // When opening set modal via "New Set +" button, clear editSetIndex
  document.querySelectorAll('[data-bs-target="#setEditModal"]').forEach(btn => {
    btn.addEventListener('click', () => {
      editSetIndex = null;
      document.getElementById('setName').value = '';
      document.getElementById('setDesc').value = '';
      document.getElementById('setModalTitle').textContent = 'New Set';
    });
  });

  /* =========================================================
     D) ALL CARDS GRID (PRODUCTION)
     ========================================================= */

function renderCards() {
  cardsGrid.innerHTML = '';

  // Start with all cards, but keep their original index
  let list = cards.map((card, idx) => ({ card, idx }));

  // If a set filter is active, keep only cards in that set
  if (activeSetFilter) {
    list = list.filter(entry =>
      Array.isArray(entry.card.sets) &&
      entry.card.sets.includes(activeSetFilter)
    );
  }

  /* -----------------------------------------
     SHOW OR HIDE THE "ACTIVE SET" BANNER
     ----------------------------------------- */
  if (activeSetFilter) {
    activeSetIndicator.classList.remove('d-none');
    activeSetLabel.textContent = activeSetFilter;
  } else {
    activeSetIndicator.classList.add('d-none');
    activeSetLabel.textContent = '';
  }

  // Render whatever is in the list (filtered or not)
  list.forEach(({ card, idx }) => {
    const col = document.createElement('div');
    col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';

    const wrapper = document.createElement('div');
    wrapper.className = 'card h-100';
    wrapper.dataset.index = idx;

    const body = document.createElement('div');
    body.className = 'card-body';

    const esLbl = document.createElement('div');
    esLbl.className = 'small text-muted';
    esLbl.textContent = 'Spanish';

    const esH = document.createElement('h5');
    esH.className = 'card-title mb-1';
    esH.textContent = card.es;

    const enLbl = document.createElement('div');
    enLbl.className = 'small text-muted';
    enLbl.textContent = 'English';

    const enP = document.createElement('p');
    enP.className = 'card-text mb-2';
    enP.textContent = card.en;

    body.append(esLbl, esH, enLbl, enP);

    // Optional notes
    if (card.notes) {
      const notesP = document.createElement('p');
      notesP.className = 'text-muted small mb-2';
      notesP.textContent = card.notes;
      body.appendChild(notesP);
    }

    // Badges (sets)
    if (card.sets?.length) {
      const badges = document.createElement('div');
      badges.className = 'd-flex flex-wrap gap-1 mb-2';
      card.sets.forEach(s => {
        const b = document.createElement('span');
        b.className = 'badge text-bg-light';
        b.textContent = s;
        badges.appendChild(b);
      });
      body.appendChild(badges);
    }

    const row = document.createElement('div');
    row.className = 'd-flex justify-content-between';

    const edit = document.createElement('button');
    edit.className = 'btn btn-sm btn-outline-primary';
    edit.dataset.action = 'editCard';
    edit.textContent = 'Edit';

    const del = document.createElement('button');
    del.className = 'btn btn-sm btn-outline-danger';
    del.dataset.action = 'deleteCard';
    del.textContent = 'Delete';

    row.append(edit, del);
    body.appendChild(row);

    wrapper.appendChild(body);
    col.appendChild(wrapper);
    cardsGrid.appendChild(col);
  });
}




  /* =========================================================
     E) ADD / EDIT CARD MODAL LIFECYCLE (PRODUCTION)
     ========================================================= */

  // When you open the card modal from any "+ Add Card" button, treat it as "new card"
  document.querySelectorAll('[data-bs-target="#cardModal"]').forEach(btn => {
    btn.addEventListener('click', () => { editIndex = null; });
  });

  const cardModalEl = document.getElementById('cardModal');

  cardModalEl.addEventListener('show.bs.modal', () => {
    if (editIndex === null) {
      // New card → clear form
      const form = document.getElementById('cardForm');
      form.reset();
      notesEl.value = '';
      Array.from(setsEl.options).forEach(o => { o.selected = false; });
      setsEl.selectedIndex = -1;
    }
  });

  cardModalEl.addEventListener('hidden.bs.modal', () => {
    // Always clear set selection when modal closes
    Array.from(setsEl.options).forEach(o => { o.selected = false; });
    setsEl.selectedIndex = -1;
  });

  // PRODUCTION: create or update a card
  document.getElementById('cardForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const es    = document.getElementById('esText').value.trim();
    const en    = document.getElementById('enText').value.trim();
    const notes = notesEl.value.trim();
    const sets  = getSelectedSets();

    if (!es || !en) return;

    if (editIndex !== null) {
      // Update existing card
      cards[editIndex] = { ...cards[editIndex], es, en, notes, sets };
      editIndex = null;
    } else {
      // New card at top
      cards.unshift({ es, en, notes, sets });
    }

    localStorage.setItem('cards', JSON.stringify(cards));
    renderCards();

    const m = document.getElementById('cardModal');
    (bootstrap.Modal.getInstance(m) || new bootstrap.Modal(m)).hide();

    new bootstrap.Toast(document.getElementById('appToast')).show();

    e.target.reset();
    setSelectedSets([]);
  });

  // PRODUCTION: handle Edit/Delete clicks in All Cards grid
  cardsGrid.addEventListener('click', (e) => {
    if (e.target.dataset.action === 'deleteCard') {
      const idx = e.target.closest('[data-index]').dataset.index;
      cards.splice(idx, 1);
      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
    }

    if (e.target.dataset.action === 'editCard') {
      const idx = Number(e.target.closest('[data-index]').dataset.index);
      editIndex = idx;

      // Load card into modal fields
      document.getElementById('esText').value = cards[idx].es || '';
      document.getElementById('enText').value = cards[idx].en || '';
      notesEl.value = cards[idx].notes || '';
      setSelectedSets(cards[idx].sets || []);

      const modal = new bootstrap.Modal(document.getElementById('cardModal'));
      modal.show();
    }
  });

  /* =========================================================
     F) PRACTICE LOGIC (PRODUCTION, uses real cards/sets)
     ========================================================= */

  const practiceCardEl   = document.getElementById('practiceCard');
  const progressPill     = document.getElementById('progressPill');
  const statusPill       = document.getElementById('statusPill');
  const answerReveal     = document.getElementById('answerReveal');
  const answerRevealText = document.getElementById('answerRevealText');
  const showAnswerBtn    = document.getElementById('showAnswerBtn');
  const gotItBtn         = document.getElementById('gotItBtn');
  const learningBtn      = document.getElementById('learningBtn');

  let practiceDeck   = [];   // PRODUCTION: subset of cards[] plus _idx
  let currentIndex   = 0;
  let flipped        = false;
  const statusByCard = {};   // PRODUCTION: per-card "gotit"/"learning" labels

  // PRODUCTION: build deck from cards[] based on chosen set
  function buildPracticeDeck() {
    const choice = practiceSetSelect.value;

    // Add original index so we can key statusByCard
    let all = cards.map((card, idx) => ({ ...card, _idx: idx }));

    if (choice !== 'all') {
      all = all.filter(c => Array.isArray(c.sets) && c.sets.includes(choice));
    }

    practiceDeck = all;
    currentIndex = 0;
    flipped      = false;
    resetAnswerReveal();
  }

  // PRODUCTION: fill the big practice card with current entry
  function renderPracticeCard() {
    if (!practiceDeck.length) {
      // Edge case: no cards in this set
      document.getElementById('frontLabel').textContent = 'Spanish';
      document.getElementById('backLabel').textContent  = 'English';
      document.getElementById('frontText').textContent  = 'No cards in this set yet';
      document.getElementById('backText').textContent   = '';
      practiceCardEl.classList.remove('flipped');
      progressPill.textContent = '0 / 0';
      statusPill.classList.add('d-none');
      statusPill.textContent = '';
      return;
    }

    const sideES = document.querySelector('input[name="startSide"]:checked').value === 'es';
    const entry  = practiceDeck[currentIndex];
    const card   = entry;

    const frontLabel = sideES ? 'Spanish' : 'English';
    const backLabel  = sideES ? 'English' : 'Spanish';
    const frontText  = sideES ? card.es : card.en;
    const backText   = sideES ? card.en : card.es;

    document.getElementById('frontLabel').textContent = frontLabel;
    document.getElementById('backLabel').textContent  = backLabel;
    document.getElementById('frontText').textContent  = frontText;
    document.getElementById('backText').textContent   = backText;

    practiceCardEl.classList.toggle('flipped', flipped);

    progressPill.textContent = `Card ${currentIndex + 1} / ${practiceDeck.length}`;

    // Show "Got it" / "Still learning" pill
    const st = statusByCard[entry._idx];
    if (!st) {
      statusPill.classList.add('d-none');
      statusPill.textContent = '';
    } else {
      statusPill.classList.remove('d-none');
      if (st === 'gotit') {
        statusPill.textContent = 'Got it';
        statusPill.className = 'badge rounded-pill text-bg-success';
      } else {
        statusPill.textContent = 'Still learning';
        statusPill.className = 'badge rounded-pill text-bg-warning';
      }
    }
  }

  function resetAnswerReveal() {
    answerReveal.classList.remove('open');
    answerRevealText.textContent = '';
    showAnswerBtn.textContent = 'Show Answer';
  }

  // PRODUCTION: flip via button
  document.getElementById('flipBtn').onclick = () => {
    flipped = !flipped;
    renderPracticeCard();
  };

  // PRODUCTION: flip by clicking card
  practiceCardEl.onclick = () => {
    flipped = !flipped;
    renderPracticeCard();
  };

  // PRODUCTION: reveal the "start side" text as smaller answer
  showAnswerBtn.addEventListener('click', () => {
    if (!practiceDeck.length) return;

    const sideES = document.querySelector('input[name="startSide"]:checked').value === 'es';
    const entry  = practiceDeck[currentIndex];
    const card   = entry;

    // Show the answer text (which is the opposite side from what's shown)
    answerRevealText.textContent = sideES ? card.en : card.es;

    answerReveal.classList.toggle('open');
    showAnswerBtn.textContent = answerReveal.classList.contains('open')
      ? 'Hide Answer'
      : 'Show Answer';
  });

  // PRODUCTION: mark card as got it / still learning (in-memory only)
  function setStatus(status) {
    if (!practiceDeck.length) return;
    const entry = practiceDeck[currentIndex];
    statusByCard[entry._idx] = status;
    renderPracticeCard();
  }

  gotItBtn.addEventListener('click',    () => setStatus('gotit'));
  learningBtn.addEventListener('click', () => setStatus('learning'));

  // PRODUCTION: next / previous navigation
  document.getElementById('nextBtn').onclick = () => {
    if (!practiceDeck.length) return;
    flipped = false;
    currentIndex = (currentIndex + 1) % practiceDeck.length;
    resetAnswerReveal();
    renderPracticeCard();
  };

  document.getElementById('prevBtn').onclick = () => {
    if (!practiceDeck.length) return;
    flipped = false;
    currentIndex = (currentIndex - 1 + practiceDeck.length) % practiceDeck.length;
    resetAnswerReveal();
    renderPracticeCard();
  };

  // PRODUCTION: reset clears progress + statuses
  document.getElementById('resetBtn').onclick = () => {
    if (!practiceDeck.length) return;
    currentIndex = 0;
    flipped      = false;
    Object.keys(statusByCard).forEach(k => delete statusByCard[k]); // clear Got it / Still learning
    resetAnswerReveal();
    renderPracticeCard();
  };

  // PRODUCTION: shuffle deck in-place
  document.getElementById('shuffleBtn').onclick = () => {
    if (!practiceDeck.length) return;
    for (let i = practiceDeck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [practiceDeck[i], practiceDeck[j]] = [practiceDeck[j], practiceDeck[i]];
    }
    currentIndex = 0;
    flipped = false;
    resetAnswerReveal();
    renderPracticeCard();
  };

  // PRODUCTION: switching start side re-renders card
  document.querySelectorAll('input[name="startSide"]').forEach(r => {
    r.addEventListener('change', () => {
      flipped = false;
      resetAnswerReveal();
      renderPracticeCard();
    });
  });

  // PRODUCTION: when Practice modal is triggered, build deck from real cards
  document.querySelector('[data-bs-target="#practiceModal"]')
    .addEventListener('click', () => {
      buildPracticeDeck();
      renderPracticeCard();
    });

  /* =========================================================
     G) SEARCH FILTER (PRODUCTION)
     ========================================================= */

  const searchInput = document.getElementById('searchCards');
  searchInput.addEventListener('input', () => {
    const term = searchInput.value.toLowerCase();
    document.querySelectorAll('#cardsGrid .card').forEach(card => {
      const text = card.textContent.toLowerCase();
      card.parentElement.style.display = text.includes(term) ? '' : 'none';
    });
  });

  /* =========================================================
     H) SIMPLE TABS (PRODUCTION)
     ========================================================= */

  const tabLinks = document.querySelectorAll('.navbar-nav .nav-link');
  const tabPanes = document.querySelectorAll('.tab-content .tab-pane');

  tabLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();

      const targetId = link.getAttribute('href');

      tabLinks.forEach(l => l.classList.remove('active'));
      tabPanes.forEach(pane => pane.classList.remove('show', 'active'));

      link.classList.add('active');

      const targetPane = document.querySelector(targetId);
      if (targetPane) {
        targetPane.classList.add('show', 'active');
      }
    });
  });

  /* =========================================================
     I) SWIPE HANDLING (PRODUCTION, but optional UX)
     ========================================================= */

  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  const swipeThreshold = 60;

  function handleStart(e) {
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    currentX = startX;
  }
  function handleMove(e) {
    if (!isDragging) return;
    currentX = e.touches ? e.touches[0].clientX : e.clientX;
    const delta = currentX - startX;
    practiceCardEl.style.transform = `translateX(${delta}px)`;
  }
  function handleEnd() {
    if (!isDragging) return;
    isDragging = false;
    const delta = currentX - startX;

    if (delta < -swipeThreshold) {
      // swipe left → next
      practiceCardEl.style.transition = "transform .25s ease";
      practiceCardEl.style.transform = "translateX(-400px)";
      setTimeout(() => {
        document.getElementById("nextBtn").click();
        practiceCardEl.style.transition = "none";
        practiceCardEl.style.transform = "translateX(400px)";
        setTimeout(() => {
          practiceCardEl.style.transition = "transform .25s ease";
          practiceCardEl.style.transform = "translateX(0)";
        }, 20);
      }, 200);
      return;
    }

    if (delta > swipeThreshold) {
      // swipe right → previous
      practiceCardEl.style.transition = "transform .25s ease";
      practiceCardEl.style.transform = "translateX(400px)";
      setTimeout(() => {
        document.getElementById("prevBtn").click();
        practiceCardEl.style.transition = "none";
        practiceCardEl.style.transform = "translateX(-400px)";
        setTimeout(() => {
          practiceCardEl.style.transition = "transform .25s ease";
          practiceCardEl.style.transform = "translateX(0)";
        }, 20);
      }, 200);
      return;
    }

    // not far enough → snap back
    practiceCardEl.style.transition = "transform .2s ease";
    practiceCardEl.style.transform = "translateX(0)";
  }

  practiceCardEl.addEventListener("mousedown", handleStart);
  practiceCardEl.addEventListener("mousemove", handleMove);
  practiceCardEl.addEventListener("mouseup", handleEnd);
  practiceCardEl.addEventListener("mouseleave", handleEnd);

  practiceCardEl.addEventListener("touchstart", handleStart);
  practiceCardEl.addEventListener("touchmove", handleMove);
  practiceCardEl.addEventListener("touchend", handleEnd);

// CLEAR FILTER: when user clicks "Clear filter", show all cards again
const clearFilterBtn = document.getElementById('clearSetFilter');

clearFilterBtn?.addEventListener('click', () => {
  activeSetFilter = null;   // remove filter
  renderCards();            // re-render all cards

  // Switch back to All Cards tab (optional but nice)
  const allCardsLink = document.querySelector('.nav-link[href="#tab-cards"]');
  if (allCardsLink) {
    allCardsLink.click();
  }
});




  /* =========================================================
     J) INITIAL LOAD (PRODUCTION)
     ========================================================= */

  // On page load:
  // 1) Fill selects with any saved sets
  // 2) Render the sets list
  // 3) Render all cards
  userSets.forEach(name => addSetOption(name));
  renderUserSets();
  renderCards();
</script>
