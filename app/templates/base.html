<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lemmatica</title>

    <!-- PRODUCTION: real Bootstrap CSS, no demo here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">

  </head>

  <body>
    {% include 'layout_header.html' %}

    {% block content %}{% endblock %}

    <!-- PRODUCTION: real Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="text-center py-3 mt-auto text-muted small">
      © 2025 Lemmatica — a social impact project
    </footer>

    <script>
      /* =========================================================
      A) STATE (PRODUCTION, client-side only)
      ---------------------------------------------------------
      - Cards + set names are persisted in localStorage.
      - No server / login, so this is "production" for a demo
        or MVP that runs entirely in the browser.
      ========================================================= */

      let cards = JSON.parse(localStorage.getItem('cards') || '[]');        // PRODUCTION: actual flashcards
      let userSets = JSON.parse(localStorage.getItem('userSets') || '[]');  // PRODUCTION: set objects with name and description

      // Migration: convert old string-based sets to objects
      if (userSets.length > 0 && typeof userSets[0] === 'string') {
        userSets = userSets.map(name => ({ name, description: '' }));
        localStorage.setItem('userSets', JSON.stringify(userSets));
      }

      // NEW: which set (if any) is being viewed on the All Cards tab
      let activeSetFilter = null;
      let editIndex = null; // PRODUCTION: index into cards[] when editing
      let editSetIndex = null; // Index into userSets[] when editing a set
    </script>

    <script src="{{ url_for('static', filename='cards_logic.js') }}"></script> 
    <script src="{{ url_for('static', filename='sets_logic.js') }}"></script> 
    <script src="{{ url_for('static', filename='practice_logic.js') }}"></script>

    <script>
      /* =========================================================
      J) INITIAL LOAD (PRODUCTION)
      ========================================================= */

      // On page load:
      // 1) Fill selects with any saved sets
      // 2) Render the sets list
      // 3) Render all cards
      userSets.forEach(name => addSetOption(name));
      renderUserSets();
      renderCards();
    </script>
  </body>
</html>
