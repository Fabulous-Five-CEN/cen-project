<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lemmatica</title>

    <!-- PRODUCTION: real Bootstrap CSS, no demo here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">

  </head>

  <body>
    {% include 'layout_header.html' %}

    {% block content %}{% endblock %}

    <!-- PRODUCTION: real Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="text-center py-3 mt-auto text-muted small">
      © 2025 Lemmatica — a social impact project
    </footer>

    <script>
      /* =========================================================
      A) STATE (PRODUCTION, client-side only)
      ---------------------------------------------------------
      - Cards + set names are persisted in localStorage.
      - No server / login, so this is "production" for a demo
        or MVP that runs entirely in the browser.
      ========================================================= */


      document.addEventListener('DOMContentLoaded', () => {
        // Get the current path (e.g., '/cards', '/sets', '/')
        const currentPath = window.location.pathname;

        // Determine which link to activate based on the path
        let activeLinkId = '';

        if (currentPath.includes('/cards')) {
            activeLinkId = 'nav-cards-link';
        } else if (currentPath.includes('/sets')) {
            activeLinkId = 'nav-sets-link';
        } else if (currentPath.includes('/practice')) {
            activeLinkId = 'nav-practice-link';
        } else if (currentPath.includes('/auth/account')) {
            activeLinkId = 'nav-account-link';
        } else {
            activeLinkId = 'nav-dash-link';
        }

        // Apply the active styling
        if (activeLinkId && activeLinkId != 'nav-dash-link') {
            const activeLink = document.getElementById(activeLinkId);
            if (activeLink) {
                // Bootstrap's 'active' class usually handles the styling.
                activeLink.classList.add('active', 'text-white'); 
            }
        }
      });
    </script>

    <script src="{{ url_for('static', filename='cards_logic.js') }}"></script> 
    <script src="{{ url_for('static', filename='sets_logic.js') }}"></script> 
    <script src="{{ url_for('static', filename='practice_logic.js') }}"></script>
    <script src="{{ url_for('static', filename='auth_logic.js') }}"></script>


    <script>
      /* =========================================================
      J) INITIAL LOAD (PRODUCTION)
      ========================================================= */

      // On page load:
      // 1) Fill selects with any saved sets
      // 2) Render the sets list
      // 3) Render all cards
      // 4) Sync account info

      userSets.forEach(name => addSetOption(name));
      renderUserSets();
      renderCards();
    </script>
  </body>
</html>
