{% extends 'base.html' %}

{% block content %}
<main id="account-page" class="container py-4 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Sign in</h5>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" type="email" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" type="password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </form>

          <div class="text-center small mt-3 text-muted">Demo mode coming soon</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    const response = await fetch("/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    });

    const result = await response.json();

    if (response.ok) {
        // backend tells the frontend where to go
        window.location.href = result.redirect;
    } else {
        alert(result.error || "Login failed");
    }
});
</script>
{% endblock %}
