{% extends 'base.html' %}

{% block content %}
<main id="cards-page" class="container py-4 flex-grow-1">
    <!-- ========== TAB: All Cards (PRODUCTION) ========== -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
        <h4 class="section-title mb-0">All Cards</h4>
        <div class="section-subtitle">Browse, search, and edit your phrase cards.</div>
        </div>
    </div>

    <div class="d-flex gap-2 align-items-center mb-3">
        <!-- PRODUCTION: live search filter -->
        <input id="searchCards" class="form-control" placeholder="Search cards…">
        <!-- PRODUCTION: opens real Add/Edit card modal -->
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#cardModal">
        Add Card +
        </button>
    </div>

    <div id="activeSetIndicator" class="alert alert-secondary py-1 px-2 d-inline-flex align-items-center small d-none mb-3">
        <span id="activeSetLabel" class="me-2"></span>
        <button id="clearSetFilter"
        type="button"
        class="btn btn-sm btn-outline-secondary">
        Clear filter
        </button>
    </div>

    <!-- PRODUCTION: populated from localStorage "cards" -->
    <div id="cardsGrid" class="row g-3"></div>

      <!-- =========================
       Floating “+” Add Card button
       Opens the same #cardModal as the toolbar button
       ========================= -->
  <button class="btn btn-primary rounded-circle fab shadow" style="width:56px;height:56px"
          data-bs-toggle="modal" data-bs-target="#cardModal" aria-label="Add card">+</button>

  <!-- =====================================================
       ADD / EDIT CARD MODAL
       - Single modal used for both creating and editing a card
       - We track “editIndex” in JS to know which mode we’re in
       ===================================================== -->
  <div class="modal fade" id="cardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="cardForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Card</h5>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <!-- Required: Spanish text -->
            <div class="col-md-6">
              <label class="form-label">Spanish</label>
              <textarea class="form-control" id="esText" rows="3" required></textarea>
            </div>
            <!-- Required: English text -->
            <div class="col-md-6">
              <label class="form-label">English</label>
              <textarea class="form-control" id="enText" rows="3" required></textarea>
            </div>
            <!-- Optional: notes -->
            <div class="col-12">
              <label class="form-label">Notes (optional)</label>
              <textarea class="form-control" id="notes" rows="2"></textarea>
            </div>
            <!-- Optional: place card in one or more sets (none by default) -->
            <div class="col-12">
              <label class="form-label">Add to set (optional)</label>
              <select id="cardSets" class="form-select" multiple size="4">
                <option value="" disabled selected hidden>(no set)</option>
                <!-- Add <option value="setId">Set Name</option> when you implement sets -->
              </select>
              <div class="form-text">Select one or more sets.</div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <!-- Closes modal without saving -->
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <!-- Triggers JS submit handler below -->
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- PRODUCTION: Toast used when saving cards -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="appToast" class="toast align-items-center text-bg-success border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">Saved.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

<!-- =====================================
    APP SCRIPT (localStorage + UI wiring)
    ===================================== -->
  <script>
      /* =========================================================
     A) STATE (PRODUCTION, client-side only)
     ---------------------------------------------------------
     - Cards + set names are persisted in localStorage.
     - No server / login, so this is "production" for a demo
       or MVP that runs entirely in the browser.
     ========================================================= */

  let cards = JSON.parse(localStorage.getItem('cards') || '[]');        // PRODUCTION: actual flashcards
  let userSets = JSON.parse(localStorage.getItem('userSets') || '[]');  // PRODUCTION: set objects with name and description

  // Migration: convert old string-based sets to objects
  if (userSets.length > 0 && typeof userSets[0] === 'string') {
    userSets = userSets.map(name => ({ name, description: '' }));
    localStorage.setItem('userSets', JSON.stringify(userSets));
  }


  // NEW: which set (if any) is being viewed on the All Cards tab
  let activeSetFilter = null;

  /* =========================================================
     B) DOM REFS (PRODUCTION)
     ========================================================= */

  const cardsGrid         = document.getElementById('cardsGrid');
  const notesEl           = document.getElementById('notes');
  const setsEl            = document.getElementById('cardSets');
  const practiceSetSelect = document.getElementById('practiceSet');
  const userSetsList      = document.getElementById('userSetsList');

  const activeSetIndicator = document.getElementById('activeSetIndicator');
  const activeSetLabel     = document.getElementById('activeSetLabel');
  const clearSetFilterBtn  = document.getElementById('clearSetFilter');


  let editIndex = null; // PRODUCTION: index into cards[] when editing
  let editSetIndex = null; // Index into userSets[] when editing a set

    /* =========================================================
     C) SETS HELPERS (PRODUCTION, but counts still TODO)
     ========================================================= */

  // PRODUCTION: read which sets were checked for a card
  function getSelectedSets() {
    return Array.from(setsEl.options)
      .filter(o => o.selected && o.value)
      .map(o => o.value);
  }

  // PRODUCTION: pre-select sets for Edit Card
  function setSelectedSets(values = []) {
    Array.from(setsEl.options).forEach(o => {
      o.selected = values.includes(o.value);
    });
  }

  // PRODUCTION: inject a set name into both selects
  function addSetOption(setObj) {
    const name = typeof setObj === 'string' ? setObj : setObj.name;
    if (!name) return;

    // Add to Add-Card modal's select
    let exists = Array.from(setsEl.options).some(o => o.value === name);
    if (!exists) {
      const opt = new Option(name, name);
      setsEl.appendChild(opt);
    }

    // Add to Practice select
    exists = Array.from(practiceSetSelect.options).some(o => o.value === name);
    if (!exists) {
      const opt2 = new Option(name, name);
      practiceSetSelect.appendChild(opt2);
    }
  }

  // Count cards in a specific set
  function countCardsInSet(setName) {
    return cards.filter(card => 
      Array.isArray(card.sets) && card.sets.includes(setName)
    ).length;
  }

    // PRODUCTION: render the list of sets on the "My Sets" tab
  // Show user-created sets on My Sets tab, with View + Delete buttons
function renderUserSets() {
  if (!userSetsList) return;

  const emptyState = document.getElementById('emptySetsMessage');

  userSetsList.innerHTML = '';

  if (!userSets.length) {
    // No sets → show empty message
    if (emptyState) emptyState.classList.remove('d-none');
    return;
  }

  // We have sets → hide empty message
  if (emptyState) emptyState.classList.add('d-none');

  userSets.forEach((setObj, index) => {
    const name = setObj.name;
    const description = setObj.description || '';
    const cardCount = countCardsInSet(name);
    
    const card = document.createElement('div');
    card.className = 'card border-0 shadow-sm';

    const body = document.createElement('div');
    body.className = 'card-body py-2';

    body.innerHTML = `
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <div class="fw-semibold">${name}</div>
          ${description ? `<div class="small text-muted mt-1">${description}</div>` : ''}
          <div class="small text-muted mt-1">${cardCount} card${cardCount !== 1 ? 's' : ''}</div>
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn btn-sm btn-outline-secondary"
            data-action="editSet"
            data-set-index="${index}">
            Edit
          </button>
          <button
            class="btn btn-sm btn-outline-primary"
            data-action="viewSet"
            data-set-name="${name}">
            View
          </button>
          <button
            class="btn btn-sm btn-outline-danger"
            data-action="deleteSet"
            data-set-name="${name}">
            Delete
          </button>
        </div>
      </div>
    `;

    card.appendChild(body);
    userSetsList.appendChild(card);
  });
}


  // PRODUCTION: Handle clicks on the My Sets list (View + Delete + Edit)
userSetsList.addEventListener('click', (e) => {
  const action = e.target.dataset.action;
  const name   = e.target.dataset.setName;
  const index  = e.target.dataset.setIndex;
  
  if (!action) return;

  // EDIT: open modal with existing name and description
  if (action === 'editSet') {
    editSetIndex = parseInt(index);
    const setObj = userSets[editSetIndex];
    
    document.getElementById('setName').value = setObj.name;
    document.getElementById('setDesc').value = setObj.description || '';
    document.getElementById('setModalTitle').textContent = 'Edit Set';
    
    const modalEl = document.getElementById('setEditModal');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();
    return;
  }

  // VIEW: jump to All Cards and filter by this set
  if (action === 'viewSet') {
    activeSetFilter = name;          // remember which set we're showing
    renderCards();                   // re-render All Cards using filter

    // switch navbar to "All Cards" tab
    const allCardsLink = document.querySelector('.nav-link[href="#tab-cards"]');
    if (allCardsLink) {
      allCardsLink.click();
    }
    return;
  }

  // DELETE: remove the set everywhere
  if (action === 'deleteSet') {
    if (!window.confirm(
      `Delete set "${name}"? This will remove it from cards but not delete the cards themselves.`
    )) {
      return;
    }

    // 1) Remove from userSets array + localStorage
    userSets = userSets.filter(s => s.name !== name);
    localStorage.setItem('userSets', JSON.stringify(userSets));

    // 2) Remove from the "Add to set" dropdown in the Card modal
    Array.from(setsEl.options).forEach(o => {
      if (o.value === name) o.remove();
    });

    // 3) Remove from the Practice set dropdown
    Array.from(practiceSetSelect.options).forEach(o => {
      if (o.value === name) o.remove();
    });

    // 4) Remove this set tag from any cards that used it
    cards = cards.map(card => {
      const oldSets = Array.isArray(card.sets) ? card.sets : [];
      const newSets = oldSets.filter(s => s !== name);
      return { ...card, sets: newSets };
    });
    localStorage.setItem('cards', JSON.stringify(cards));

    // 5) If we were viewing this set, clear the filter
    if (activeSetFilter === name) {
      activeSetFilter = null;
    }

    // 6) Re-render UI
    renderUserSets();
    renderCards();
  }
});






  // PRODUCTION: handle New Set form submit (creates real set names)
  document.getElementById('setForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const nameInput = document.getElementById('setName');
    const descInput = document.getElementById('setDesc');

    const name = nameInput.value.trim();
    const description = descInput.value.trim();
    
    if (!name) return;

    if (editSetIndex !== null) {
      // EDITING existing set
      const oldName = userSets[editSetIndex].name;
      
      // Update the set object
      userSets[editSetIndex] = { name, description };
      localStorage.setItem('userSets', JSON.stringify(userSets));
      
      // If name changed, update it everywhere
      if (oldName !== name) {
        // Update in card modal dropdown
        Array.from(setsEl.options).forEach(o => {
          if (o.value === oldName) {
            o.value = name;
            o.text = name;
          }
        });
        
        // Update in practice dropdown
        Array.from(practiceSetSelect.options).forEach(o => {
          if (o.value === oldName) {
            o.value = name;
            o.text = name;
          }
        });
        
        // Update in all cards that reference this set
        cards = cards.map(card => {
          if (Array.isArray(card.sets)) {
            return {
              ...card,
              sets: card.sets.map(s => s === oldName ? name : s)
            };
          }
          return card;
        });
        localStorage.setItem('cards', JSON.stringify(cards));
        
        // Update active filter if it was showing this set
        if (activeSetFilter === oldName) {
          activeSetFilter = name;
        }
      }
      
      editSetIndex = null;
      renderUserSets();
      renderCards();
      
    } else {
      // CREATING new set
      // 1) Add to selects so you can assign cards to this set
      addSetOption({ name, description });

      // 2) Persist the set
      if (!userSets.some(s => s.name === name)) {
        userSets.push({ name, description });
        localStorage.setItem('userSets', JSON.stringify(userSets));
        renderUserSets(); // re-render My Sets list
      }
    }

    // 3) Clear + close modal
    nameInput.value = '';
    descInput.value = '';

    const modalEl = document.getElementById('setEditModal');
    const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
    modal.hide();
  });

  // When opening set modal via "New Set +" button, clear editSetIndex
  document.querySelectorAll('[data-bs-target="#setEditModal"]').forEach(btn => {
    btn.addEventListener('click', () => {
      editSetIndex = null;
      document.getElementById('setName').value = '';
      document.getElementById('setDesc').value = '';
      document.getElementById('setModalTitle').textContent = 'New Set';
    });
  });

    /* =========================================================
     E) ADD / EDIT CARD MODAL LIFECYCLE (PRODUCTION)
     ========================================================= */

  // When you open the card modal from any "+ Add Card" button, treat it as "new card"
  document.querySelectorAll('[data-bs-target="#cardModal"]').forEach(btn => {
    btn.addEventListener('click', () => { editIndex = null; });
  });

  const cardModalEl = document.getElementById('cardModal');

  cardModalEl.addEventListener('show.bs.modal', () => {
    if (editIndex === null) {
      // New card → clear form
      const form = document.getElementById('cardForm');
      form.reset();
      notesEl.value = '';
      Array.from(setsEl.options).forEach(o => { o.selected = false; });
      setsEl.selectedIndex = -1;
    }
  });

  cardModalEl.addEventListener('hidden.bs.modal', () => {
    // Always clear set selection when modal closes
    Array.from(setsEl.options).forEach(o => { o.selected = false; });
    setsEl.selectedIndex = -1;
  });

  // PRODUCTION: create or update a card
  document.getElementById('cardForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const es    = document.getElementById('esText').value.trim();
    const en    = document.getElementById('enText').value.trim();
    const notes = notesEl.value.trim();
    const sets  = getSelectedSets();

    if (!es || !en) return;

    if (editIndex !== null) {
      // Update existing card
      cards[editIndex] = { ...cards[editIndex], es, en, notes, sets };
      editIndex = null;
    } else {
      // New card at top
      cards.unshift({ es, en, notes, sets });
    }

    localStorage.setItem('cards', JSON.stringify(cards));
    renderCards();

    const m = document.getElementById('cardModal');
    (bootstrap.Modal.getInstance(m) || new bootstrap.Modal(m)).hide();

    new bootstrap.Toast(document.getElementById('appToast')).show();

    e.target.reset();
    setSelectedSets([]);
  });

  // PRODUCTION: handle Edit/Delete clicks in All Cards grid
  cardsGrid.addEventListener('click', (e) => {
    if (e.target.dataset.action === 'deleteCard') {
      const idx = e.target.closest('[data-index]').dataset.index;
      cards.splice(idx, 1);
      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
    }

    if (e.target.dataset.action === 'editCard') {
      const idx = Number(e.target.closest('[data-index]').dataset.index);
      editIndex = idx;

      // Load card into modal fields
      document.getElementById('esText').value = cards[idx].es || '';
      document.getElementById('enText').value = cards[idx].en || '';
      notesEl.value = cards[idx].notes || '';
      setSelectedSets(cards[idx].sets || []);

      const modal = new bootstrap.Modal(document.getElementById('cardModal'));
      modal.show();
    }
  });

    /* ****************************************************
    * D) RENDER CARDS GRID
    * - Creates a Bootstrap card for each saved card
    * - Shows Spanish, English, optional notes, and set badges
    * - Adds Edit/Delete buttons with data-action attributes
    * **************************************************** */
    function renderCards() {
    cardsGrid.innerHTML = ''; // clear

    cards.forEach((card, index) => {
        const col = document.createElement('div');
        col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
        col.innerHTML = `
        <div class="card h-100" data-index="${index}">
            <div class="card-body">
            <div class="small text-muted">Spanish</div>
            <h5 class="card-title mb-1">${card.es}</h5>

            <div class="small text-muted">English</div>
            <p class="card-text mb-2">${card.en}</p>

            ${card.notes ? `<p class="text-muted small mb-2">${card.notes}</p>` : ``}

            ${
                card.sets?.length
                ? `<div class="d-flex flex-wrap gap-1 mb-2">` +
                    card.sets.map(s => `<span class="badge text-bg-light">${s}</span>`).join('') +
                    `</div>`
                : ``
            }

            <div class="d-flex justify-content-between">
                <button class="btn btn-sm btn-outline-primary" data-action="editCard">Edit</button>
                <button class="btn btn-sm btn-outline-danger" data-action="deleteCard">Delete</button>
            </div>
            </div>
        </div>`;
        cardsGrid.appendChild(col);
    });
    }

    /* ****************************************************
    * E) ADD/EDIT SUBMIT HANDLER
    * - Reads form fields
    * - If editing: updates existing card
    * - Else: unshift() inserts new card at top
    * - Persists to localStorage and re-renders
    * - Closes modal and shows a toast
    * **************************************************** */
    document.getElementById('cardForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const es   = document.getElementById('esText').value.trim();
    const en   = document.getElementById('enText').value.trim();
    const notes= notesEl.value.trim();
    const sets = getSelectedSets();

    // Require both sides filled
    if (!es || !en) return;

    if (editIndex !== null) {
        // Update existing card
        cards[editIndex] = { ...cards[editIndex], es, en, notes, sets };
        editIndex = null; // leave edit mode
    } else {
        // Add new card at the top
        cards.unshift({ es, en, notes, sets });
    }

    // Persist entire array as JSON
    localStorage.setItem('cards', JSON.stringify(cards));

    // Update UI
    renderCards();

    // Close the modal (works whether first-open or existing instance)
    const m = document.getElementById('cardModal');
    (bootstrap.Modal.getInstance(m) || new bootstrap.Modal(m)).hide();

    // Show "Saved." toast
    new bootstrap.Toast(document.getElementById('appToast')).show();

    // Reset form for next add
    e.target.reset();
    setSelectedSets([]);
    });

    /* ****************************************************
    * F) ROW ACTIONS: DELETE / EDIT
    * - Delegated click listener on the grid
    * - Delete: remove from array, persist, re-render
    * - Edit: preload fields, set editIndex, show modal
    * **************************************************** */
    cardsGrid.addEventListener('click', (e) => {
    // DELETE
    if (e.target.dataset.action === 'deleteCard') {
        const idx = e.target.closest('[data-index]').dataset.index;
        cards.splice(idx, 1);
        localStorage.setItem('cards', JSON.stringify(cards));
        renderCards();
    }

    // EDIT
    if (e.target.dataset.action === 'editCard') {
        const idx = Number(e.target.closest('[data-index]').dataset.index);
        editIndex = idx;

        // Preload modal fields
        document.getElementById('esText').value = cards[idx].es || '';
        document.getElementById('enText').value = cards[idx].en || '';
        notesEl.value = cards[idx].notes || '';
        setSelectedSets(cards[idx].sets || []);

        // Open modal
        const modal = new bootstrap.Modal(document.getElementById('cardModal'));
        modal.show();
    }
    });

    /* =========================================================
     G) SEARCH FILTER (PRODUCTION)
     ========================================================= */

  const searchInput = document.getElementById('searchCards');
  searchInput.addEventListener('input', () => {
    const term = searchInput.value.toLowerCase();
    document.querySelectorAll('#cardsGrid .card').forEach(card => {
      const text = card.textContent.toLowerCase();
      card.parentElement.style.display = text.includes(term) ? '' : 'none';
    });
  });

    /* =========================================================
     J) INITIAL LOAD (PRODUCTION)
     ========================================================= */

  // On page load:
  // 1) Fill selects with any saved sets
  // 2) Render the sets list
  // 3) Render all cards
  userSets.forEach(name => addSetOption(name));
  renderUserSets();
  renderCards();
  </script>
</main>
{% endblock %}
