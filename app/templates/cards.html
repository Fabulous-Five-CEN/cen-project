{% extends 'base.html' %}

{% block content %}
<main id="cards-page" class="container py-4 flex-grow-1">
  <div class="mb-2">
      <h4 class="section-title mb-0">
        All Cards <span class="fs-5" id="cardCount">(0 cards)</span>
      </h4>

      <div class="section-subtitle">Browse, search, and edit your phrase cards. Add your cards to sets.</div>
  </div>
  
    <div class="row align-items-center mb-3">
      <div class="col-4"> 
          <input id="searchCards" class="form-control" placeholder="Search cards…">
      </div>
      
      <div class="col-auto"> 
          <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#cardModal">
              Add Card +
          </button>
      </div>
    </div>

    <div id="cardsGrid" class="row g-3"></div>

      <!-- =========================
       Floating “+” Add Card button
       Opens the same #cardModal as the toolbar button
       ========================= -->
  <button class="btn btn-primary rounded-circle fab shadow" style="width:56px;height:56px"
          data-bs-toggle="modal" data-bs-target="#cardModal" aria-label="Add card">+</button>

  <!-- =====================================================
       ADD / EDIT CARD MODAL
       - Single modal used for both creating and editing a card
       - We track “editIndex” in JS to know which mode we’re in
       ===================================================== -->
  <div class="modal fade" id="cardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content" id="cardForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Card</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <!-- Required: Spanish text -->
            <div class="col-md-6">
              <label class="form-label">Spanish</label>
              <textarea class="form-control" id="esText" rows="3" required></textarea>
            </div>
            <!-- Required: English text -->
            <div class="col-md-6">
              <label class="form-label">English</label>
              <textarea class="form-control" id="enText" rows="3" required></textarea>
            </div>

            <!-- Auto-translate: Separate Call -->
          <div class="col-md-12">
            <label class="form-label">Auto-translate</label>

            <div class="d-flex gap-2">
              <select id="translateDirection" class="form-select w-auto">
                <option value="english_to_spanish">English → Spanish</option>
                <option value="spanish_to_english">Spanish → English</option>
              </select>

              <button type="button" id="autoTranslateBtn" class="btn btn-primary">
                <i class="bi bi-gear-fill"></i> Auto-translate
              </button>
            </div>
          </div>
            <!-- Optional: notes -->
            <div class="col-12">
              <label class="form-label">Notes (optional)</label>
              <textarea class="form-control" id="notes" rows="2"></textarea>
            </div>
            
          </div>
        </div>

        <div class="modal-footer">
          <!-- Closes modal without saving -->
          <button type = "button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <!-- Triggers JS submit handler below -->
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- =====================================================
     ASSIGN CARD TO SETS MODAL
     Opens when clicking the green "+" button on a card
===================================================== -->
<div class="modal fade" id="assignSetsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="assignSetsForm">
      <div class="modal-header">
        <h5 class="modal-title">Assign to Sets</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">

        <p class="text-muted small mb-2">
          Select which sets this card belongs to:
        </p>

        <div id="assignSetsContainer"
             class="border rounded p-2"
             style="max-height: 220px; overflow-y: auto;">
        
        </div>
          <!-- js populates here -->

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>


  <!-- Popup modal used for Delete. Make sure the user doesn't accidentally delete a card! -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this card?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="confirmDeleteBtn">Yes</button>
        <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">No</button>
      </div>
    </div>
  </div>
</div>

  <!-- Toast used for “Saved.” feedback after saving a card -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="appToast" class="toast align-items-center text-bg-success border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">Saved.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>




<script id="cards-data" type="application/json">
  {{ cards | tojson | safe }}
</script>


<script>
/* ****************************************************
* A) STATE + DOM REFS
* **************************************************** */
// Container where card tiles will be rendered
const cardsGrid = document.getElementById('cardsGrid');

// Load initial cards from backend JSON
let cards = JSON.parse(document.getElementById('cards-data').textContent);


// When not null, we are editing the card at this index
let editIndex = null;
let editingCardId = null; // Track the backend card ID when editing

// Refs for optional notes + the sets <select multiple>
const notesEl = document.getElementById('notes');

/* ****************************************************
* C) ADD/EDIT MODAL LIFECYCLE
* **************************************************** */
document.querySelectorAll('[data-bs-target="#cardModal"]').forEach(btn => {
    btn.addEventListener('click', () => { 
        editIndex = null; 
        editingCardId = null;
    });
});

const cardModalEl = document.getElementById('cardModal');

cardModalEl.addEventListener('show.bs.modal', () => {
    if (editIndex === null) {
        const form = document.getElementById('cardForm');
        form.reset();
        notesEl.value = '';

    }
});

/* ****************************************************
* D) RENDER CARDS GRID
* **************************************************** */
function renderCards() {
    cardsGrid.innerHTML = ''; 
    cards.forEach((card, index) => {
        const col = document.createElement('div');
        col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
        col.innerHTML = `
        <div class="card h-100" data-index="${index}">
    
          <div class="d-flex flex-row gap-1" style="position:absolute; top:8px; right:8px;">
              
              <button class="btn btn-sm btn-primary rounded-circle" 
                  data-action="editCard" 
                  style="width:32px; height:32px; padding:0;">
                  <i class="fa-solid fa-pencil"></i>
              </button>

              <button class="btn btn-sm btn-success rounded-circle"
                  data-action="assignSets"
                  style="width:32px; height:32px; padding:0;">
                  <i class="fa-solid fa-layer-group"></i> </button>

              <button class="btn btn-sm btn-danger rounded-circle" 
                  data-action="deleteCard" 
                  style="width:32px; height:32px; padding:0;">
                  <i class="fa-solid fa-trash-can"></i>
              </button>
          </div>
          
          <div class="card-body d-flex flex-column">
              <div class="mt-2 small text-muted">Spanish</div>
              <h5 class="card-title mb-1">${card.spanish_text}</h5>

              <div class="small text-muted">English</div>
              <p class="card-text mb-2">${card.english_text}</p>

              ${card.notes ? `<p class="text-muted small mb-2">${card.notes}</p>` : ``}

              ${
                  card.sets?.length
                  ? `<div class="d-flex flex-wrap gap-1 mb-2">` +
                      card.sets.map(sName => `<span class="badge text-bg-light">${sName}</span>`).join('') +
                      `</div>`
                  : ``
              }

              </div>
        </div>`;
        cardsGrid.appendChild(col);
    });

  document.getElementById("cardCount").textContent = `(${cards.length} card${cards.length === 1 ? '' : 's'})`;
}

/* ****************************************************
* D) RENDER SETS SELECTION
* **************************************************** */
const assignModalEl = document.getElementById("assignSetsModal");
const assignSetsContainer = document.getElementById("assignSetsContainer");
let assignCardId = null;
let assignCardIndex = null;

async function loadAssignSets(selectedIds = []) {
  assignSetsContainer.innerHTML = "<div class='text-muted small'>Loading...</div>";

  const res = await fetch("/sets/all");
  const sets = await res.json();

  assignSetsContainer.innerHTML = "";

  sets.forEach(s => {
    const row = document.createElement("div");
    row.className = "form-check";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.className = "form-check-input";
    input.id = `assignSet_${s.id}`;
    input.value = s.id;

    if (selectedIds.includes(s.id)) input.checked = true;

    const label = document.createElement("label");
    label.className = "form-check-label";
    label.htmlFor = input.id;
    label.textContent = s.name;

    row.appendChild(input);
    row.appendChild(label);
    assignSetsContainer.appendChild(row);
  });
}



/* ****************************************************
* E) ADD/EDIT SUBMIT HANDLER
* **************************************************** */
document.getElementById('cardForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const es    = document.getElementById('esText').value.trim();
    const en    = document.getElementById('enText').value.trim();
    const notes = notesEl.value.trim();

    if (!es || !en) return;

    try {
        let response, data;
        if (editingCardId) {
            response = await fetch(`/cards/edit/${editingCardId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ english_text: en, spanish_text: es, notes })
            });
            data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Failed to update card');

            cards[editIndex] = { ...cards[editIndex], spanish_text: es, english_text: en, notes };
        } else {
            response = await fetch('/cards/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ english_text: en, spanish_text: es, notes })
            });
            data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Failed to create card');

            cards.unshift({ id: data.card.id, spanish_text: es, english_text: en, notes, sets : []});
        }

        renderCards();

        const m = document.getElementById('cardModal');
        (bootstrap.Modal.getInstance(m) || new bootstrap.Modal(m)).hide();

        new bootstrap.Toast(document.getElementById('appToast')).show();

        e.target.reset();
        editIndex = null;
        editingCardId = null;

    } catch (err) {
        console.error(err);
        alert(err.message);
    }
});

/* ****************************************************
* F) ROW ACTIONS: DELETE / EDIT
* **************************************************** */

let pendingDeleteIndex = null;

cardsGrid.addEventListener('click', async (e) => {
    
    const actionButton = e.target.closest('button[data-action]');
    if (!actionButton) return;

    const action = actionButton.dataset.action;
    
    const cardElement = actionButton.closest('[data-index]');
    const index = cardElement?.dataset.index;
    if (index === undefined) return;
    
    const idx = Number(index);
        
    if (action === 'deleteCard') {
        pendingDeleteIndex = idx;
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
        deleteModal.show();
    }

    if (action === 'editCard') {
        editIndex = idx;
        editingCardId = cards[editIndex].id;

        document.getElementById('esText').value = cards[editIndex].spanish_text || '';
        document.getElementById('enText').value = cards[editIndex].english_text || '';
        notesEl.value = cards[editIndex].notes || '';

        const modal = new bootstrap.Modal(document.getElementById('cardModal'));
        modal.show();
    }
    
    if (action === "assignSets") {
        assignCardIndex = idx;
        assignCardId = cards[assignCardIndex].id;

        const selected = cards[assignCardIndex].set_ids || [];

        loadAssignSets(selected);

        new bootstrap.Modal(assignModalEl).show();
    }
});

  document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (pendingDeleteIndex === null) return;

      const cardId = cards[pendingDeleteIndex].id;
      try {
          const response = await fetch(`/cards/delete/${cardId}`, { method: 'DELETE' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Failed to delete card');

          cards.splice(pendingDeleteIndex, 1);
          renderCards();
      } catch (err) {
          console.error(err);
          alert(err.message);
      } finally {
          pendingDeleteIndex = null;
          bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
      }
  });

  document.getElementById("assignSetsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (assignCardId === null || assignCardIndex === null) return;

  // Get checked set IDs
  const selectedSetIds = Array.from(assignSetsContainer.querySelectorAll("input[type=checkbox]:checked"))
                              .map(chk => Number(chk.value));

  try {
    const res = await fetch(`/sets/update-membership/${assignCardId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ set_ids: selectedSetIds })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to update card sets");

    // Update local card object
    cards[assignCardIndex].sets = selectedSetIds.map(id => {
      const input = document.getElementById(`assignSet_${id}`);
      return input ? input.nextSibling.textContent : id;
    });
    cards[assignCardIndex].set_ids = selectedSetIds;

    renderCards(); // Re-render grid to show updated badges

    bootstrap.Modal.getInstance(assignModalEl).hide();

  } catch (err) {
    console.error(err);
    alert(err.message);
  }
});



/* ****************************************************
* G) INITIAL RENDER: draw everything we have at load
* **************************************************** */
renderCards();

/* ****************************************************
* I) SEARCH FILTER
* **************************************************** */
const searchInput = document.getElementById('searchCards');
searchInput.addEventListener('input', () => {
    const term = searchInput.value.toLowerCase();
    document.querySelectorAll('#cardsGrid .card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.parentElement.style.display = text.includes(term) ? '' : 'none';
    });
});
</script>



  <script>
        document.getElementById("autoTranslateBtn").addEventListener("click", async () => {
        const direction = document.getElementById("translateDirection").value;

        // Choose source text based off of given direction
        let text = "";
        if (direction === "english_to_spanish") {
            text = document.getElementById("enText").value.trim();
        } else {
            text = document.getElementById("esText").value.trim();
        }

        if (!text) {
            alert("Text must be present to translate.");
            return;
        }

        try {
            const response = await fetch("/cards/auto-translate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, direction })
            });

            const data = await response.json();

            if (!response.ok) {
                alert("Translation failed: " + (data.error || "Unknown error"));
                return;
            }

            const translated = data.translated_text;

            // Place into the other box
            if (direction === "english_to_spanish") {
                document.getElementById("esText").value = translated;
            } else {
                document.getElementById("enText").value = translated;
            }

        } catch (err) {
            console.error(err);
            alert("Network error during translation. Please try again later.");
        }
    });



  </script>
</main>
{% endblock %}
